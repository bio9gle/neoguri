<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 12px; background: #fff; color: #292929; font: 15px/1.6 system-ui, sans-serif; }
.card { max-width: 960px; margin: auto; border: 1px solid #e3e3e0; border-radius: 12px; overflow: hidden; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 16px; background: #f7f7f5; border-bottom: 1px solid #e3e3e0; }
.type { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.actions { display: flex; gap: 8px; margin-left: auto; }
select, button { font: inherit; border: 1px solid #d4d4d0; border-radius: 7px; background: white; color: inherit; padding: 8px 12px; }
button { cursor: pointer; box-shadow: 0 2px 0 #dededb; transition: background .15s, transform .15s; }
button:hover:not(:disabled) { background: #ededeb; }
button:active:not(:disabled), button.copied { transform: translateY(2px); box-shadow: inset 0 2px 3px #0001; }
button.copied, button.copied:hover { background: #e3f3e8; color: #176739; border-color: #9bc8a9; }
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #83aef5; outline-offset: 2px; }
.editor { padding: 18px; }
.hint { margin: 0 0 10px; color: #666; font-size: 13px; }
textarea { display: block; width: 100%; min-height: 240px; resize: vertical; padding: 14px; border: 1px solid #dededb; border-radius: 8px; background: #fcfcfb; color: #292929; font: 15px/1.7 system-ui, sans-serif; tab-size: 2; }
textarea.code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 14px; }
textarea:disabled { background: #f3f3f1; }
.status { min-height: 24px; margin: 10px 0 0; font-size: 13px; color: #555; }
.preview { border-top: 1px solid #e3e3e0; padding: 18px; }
.preview-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.preview-head h2 { font-size: 15px; margin: 0; }
iframe { display: block; width: 100%; height: 340px; border: 1px solid #dededb; border-radius: 8px; background: white; }
[hidden] { display: none !important; }
@media (max-width: 450px) { body { padding: 4px; } .actions { width: 100%; margin-left: 0; justify-content: flex-end; } .editor, .preview { padding: 12px; } }

.content { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; max-height:420px; overflow:auto; font:15px/1.8 system-ui,sans-serif; }
.content.code { white-space:pre; overflow-wrap:normal; font:14px/1.7 ui-monospace,Consolas,monospace; }
</style>
</head>
<body>
<main class="card">
  <div class="toolbar">
    <strong>너구리 게임 프롬프트(기초) - 사용 AI: 클로드</strong>
    <div class="actions"><button id="copy" type="button">복사하기</button></div>
  </div>
  <div class="editor">
<!-- 작성자 수정 위치: 아래 pre 태그 안의 내용만 바꾸세요.
     원문에 & < > 가 있으면 순서대로 &amp; &lt; &gt; 로 바꿔 넣으세요.
     복사 및 실행할 때는 원래 문자로 복원됩니다.
     pre 시작 태그 바로 뒤부터 끝 태그 바로 앞까지가 복사됩니다. -->
<pre id="source" class="content" tabindex="0" aria-label="공유할 텍스트 / 프롬프트">

1980년대 아케이드 게임 스타일의 너구리 게임을 제작하는 html 코드를 작성하고, html 파일을 다운 받을 수 있도록 해줘.

       </pre>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>
  
</main>
<script>
(() => {
  'use strict';
  const source = document.getElementById('source');
  const copy = document.getElementById('copy');
  const status = document.getElementById('status');
  const text = source.textContent;
  let busy = false;
  copy.disabled = text.length === 0;
  function legacyCopy(text) {
    const helper = document.createElement('textarea');
    helper.value = text;
    helper.setAttribute('readonly', '');
    helper.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px;';
    document.body.appendChild(helper);
    let ok = false;
    try {
      helper.focus();
      helper.select();
      helper.setSelectionRange(0, helper.value.length);
      ok = document.execCommand('copy');
    } catch (_) {} finally {
      helper.remove();
      copy.focus({ preventScroll: true });
    }
    return ok;
  }
  copy.addEventListener('click', async () => {
    if (busy || !text.length) return;
    busy = true;
    let ok = legacyCopy(text);
    if (!ok) {
      try {
        if (!navigator.clipboard || !window.isSecureContext) throw new Error('unavailable');
        await navigator.clipboard.writeText(text);
        ok = true;
      } catch (_) {}
    }
    busy = false;
    copy.classList.toggle('copied', ok);
    copy.textContent = ok ? '✓ 복사됨' : '복사하기';
    if (ok) {
      status.textContent = '복사되었습니다.';
    } else {
      const selection = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(source);
      selection.removeAllRanges();
      selection.addRange(range);
      status.textContent = '자동 복사가 제한되었습니다. 선택된 내용을 Ctrl+C 또는 ⌘C로 복사하세요. 모바일에서는 길게 눌러 복사하세요.';
    }
  });

})();
</script>
</body>
</html>
